apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
containers:
- name: frontend
  image: 207717182806.dkr.ecr.ap-southeast-2.amazonaws.com/cloud-frontend:v1
  imagePullPolicy: Always
  ports:
  - containerPort: 80
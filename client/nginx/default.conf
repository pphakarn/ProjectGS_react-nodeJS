server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files, fallback to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: increase payload size for uploads
  client_max_body_size 20M;

  # Do not expose nginx version
  server_tokens off;
}

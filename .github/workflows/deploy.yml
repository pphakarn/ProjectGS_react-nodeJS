name: CI-CD to EKS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          docker build -t cloud-backend ./server
          docker tag cloud-backend:latest 207717182806.dkr.ecr.ap-southeast-1.amazonaws.com/cloud-backend:latest
          docker push 207717182806.dkr.ecr.ap-southeast-1.amazonaws.com/cloud-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t cloud-frontend ./client
          docker tag cloud-frontend:latest 207717182806.dkr.ecr.ap-southeast-1.amazonaws.com/cloud-frontend:latest
          docker push 207717182806.dkr.ecr.ap-southeast-1.amazonaws.com/cloud-frontend:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-southeast-1 --name cloud-pj

      - name: Deploy to Kubernetes
        run: |
          kubectl rollout restart deployment backend
          kubectl rollout restart deployment frontend